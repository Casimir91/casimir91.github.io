<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Il Cannone di Newton</title>
<meta name="description" content="L'esperimento mentale di Newton: più forte spari, più a lungo il proiettile cade senza mai toccare terra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme: light;
    --paper: #f3f4f1;
    --card: #ffffff;
    --ink: #1e2430;
    --ink-soft: #59637c;
    --ink-faint: #a9b0bf;
    --line: #dde1e6;
    --accent: #2a5aa8;
    background: transparent;
  }

  *{ box-sizing: border-box; }

  body{
    background: transparent;
    color: var(--ink);
    font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono{ font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .page{
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 64px) 20px 72px;
  }

  header{ margin-bottom: 28px; }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  h1{
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 4.2vw, 34px);
    line-height: 1.15;
    margin: 0 0 12px;
    text-wrap: balance;
  }

  .lede{
    font-family: 'Source Serif 4', Georgia, serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 18px;
    line-height: 1.5;
    max-width: 56ch;
    margin: 0;
  }

  .diagram{
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 20px 24px;
  }

  .viz-frame{
    position: relative;
    aspect-ratio: 16 / 11;
  }

  .orbit-svg{ display: block; width: 100%; height: 100%; }

  .readout{
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .readout .type{
    color: var(--ink);
    font-weight: 500;
  }

  .controls{ margin-top: 18px; }

  .slider-label{
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .slider-label .val{
    color: var(--accent);
    letter-spacing: normal;
    text-transform: none;
    font-weight: 500;
  }

  input[type="range"]{
    -webkit-appearance: none;
    width: 100%;
    height: 1px;
    background: var(--ink-faint);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--accent);
    cursor: pointer;
    margin-top: -6px;
  }
  input[type="range"]::-moz-range-thumb{
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track{
    height: 1px;
    background: var(--ink-faint);
  }

  .ref-ticks{
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 6px;
  }

  .presets{
    display: flex;
    gap: 18px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .preset-btn{
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 2px 0;
    cursor: pointer;
  }
  .preset-btn:hover{ color: var(--ink); border-bottom-color: var(--accent); }
  .preset-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .prose{
    margin-top: 40px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    line-height: 1.75;
    color: var(--ink);
  }
  .prose p{ max-width: 58ch; margin: 0 0 20px; }
  .prose p:last-child{ margin-bottom: 0; }

  footer.note{
    margin-top: 36px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
  }
</style>

<div class="page">

  <div class="diagram">
    <div class="viz-frame">
      <svg class="orbit-svg" id="orbitSvg" viewBox="-100 -75 200 150" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="readout">
      <span>Traiettoria: <span class="type mono" id="t-type">—</span></span>
      <span id="t-detail">—</span>
    </div>

    <div class="controls">
      <div class="slider-label">
        <span>Forza del colpo</span>
        <span class="val"><span id="vReadout">—</span> km/s</span>
      </div>
      <input type="range" id="vSlider" min="0" max="1000" step="1" value="500">
      <div class="ref-ticks">
        <span id="refCirc">orbita</span>
        <span id="refEsc">fuga</span>
      </div>
      <div class="presets">
        <button class="preset-btn" data-preset="short">Colpo debole</button>
        <button class="preset-btn" data-preset="circ">In orbita</button>
        <button class="preset-btn" data-preset="ell">Orbita larga</button>
        <button class="preset-btn" data-preset="para">Fuga esatta (parabolica)</button>
        <button class="preset-btn" data-preset="hyp">Se ne va per sempre</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- Physics ----------
  var GM = 398600.4418;          // km^3/s^2
  var R_EARTH = 6371;            // km, ground level
  var R_L = R_EARTH * 1.35;      // km, launch altitude (Newton's impossibly tall mountain)

  var V_CIRC_L = Math.sqrt(GM / R_L);
  var V_ESC_L = V_CIRC_L * Math.SQRT2;
  var V_MIN = V_CIRC_L * 0.22;
  var V_MAX = V_CIRC_L * 1.85;
  var CAP = 12 * R_L;
  var STEPS = 1000;

  function sliderToV(s){ return V_MIN + (s / STEPS) * (V_MAX - V_MIN); }
  function vToSlider(v){ return Math.round((v - V_MIN) / (V_MAX - V_MIN) * STEPS); }
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

  // General two-body solution for a purely tangential launch at r = R_L.
  // theta = 0 is always the launch point itself (not periapsis), which keeps
  // the cannon fixed on screen regardless of which apsis the launch turns out to be.
  function computeOrbit(v){
    var p = (R_L * R_L * v * v) / GM;                 // semi-latus rectum, h^2/GM
    var eps = v * v / 2 - GM / R_L;                    // specific orbital energy
    var e = Math.sqrt(Math.max(0, 1 + 2 * eps * p / GM));
    if (e < 1e-4) e = 0;

    var periBranch = v >= V_CIRC_L;                     // launch point is periapsis?
    var r_peri = p / (1 + e);                           // true periapsis distance, always valid

    var type;
    if (!periBranch) {
      type = (r_peri < R_EARTH - 1) ? "balistica" : (e < 1e-4 ? "circolare" : "ellittica");
    } else if (e < 1e-4) type = "circolare";
    else if (e < 1) type = "ellittica";
    else if (Math.abs(e - 1) < 2e-3) type = "parabolica";
    else type = "iperbolica";

    var a = e < 1 ? p / (1 - e * e) : null;
    var r_apo = e < 1 ? p * (1 + e) / (1 - e * e) : null; // = a(1+e)
    var T = e < 1 ? 2 * Math.PI * Math.sqrt(Math.pow(a, 3) / GM) : null;

    var thetaHit = null;
    if (type === "balistica") {
      var c = clamp((1 - p / R_EARTH) / e, -1, 1);
      thetaHit = Math.acos(c);
    }

    return { v: v, p: p, e: e, periBranch: periBranch, type: type, r_peri: r_peri, r_apo: r_apo, T: T, thetaHit: thetaHit };
  }

  // r(theta) with theta = 0 at the launch point, for either branch.
  function radiusAt(orbit, theta){
    return orbit.periBranch
      ? orbit.p / (1 + orbit.e * Math.cos(theta))
      : orbit.p / (1 - orbit.e * Math.cos(theta));
  }

  function samplePoints(orbit){
    var pts = [];
    if (orbit.type === "balistica") {
      var N = 200;
      for (var i = 0; i <= N; i++) {
        var th = (i / N) * orbit.thetaHit;
        var r = radiusAt(orbit, th);
        pts.push([r * Math.cos(th), r * Math.sin(th)]);
      }
      return pts;
    }
    if (!orbit.periBranch) {
      // safe sub-circular ellipse that never reaches the ground: full loop
      var N2 = 300;
      for (var j = 0; j <= N2; j++) {
        var t2 = -Math.PI + (j / N2) * 2 * Math.PI;
        pts.push([radiusAt(orbit, t2) * Math.cos(t2), radiusAt(orbit, t2) * Math.sin(t2)]);
      }
      return pts;
    }
    if (orbit.type === "circolare" || orbit.type === "ellittica") {
      var N3 = 300;
      for (var k = 0; k <= N3; k++) {
        var t3 = -Math.PI + (k / N3) * 2 * Math.PI;
        var r3 = radiusAt(orbit, t3);
        if (r3 > CAP) { pts.push(null); continue; }
        pts.push([r3 * Math.cos(t3), r3 * Math.sin(t3)]);
      }
      return pts;
    }
    // open orbit: parabola / hyperbola
    var thetaLimit = orbit.type === "parabolica" ? Math.PI * 0.985 : Math.acos(-1 / orbit.e) * 0.985;
    var M = 260;
    for (var m = -M; m <= M; m++) {
      var t4 = (m / M) * thetaLimit;
      var denom = 1 + orbit.e * Math.cos(t4);
      if (denom <= 1e-4) { pts.push(null); continue; }
      var r4 = orbit.p / denom;
      if (r4 > CAP) { pts.push(null); continue; }
      pts.push([r4 * Math.cos(t4), r4 * Math.sin(t4)]);
    }
    return pts;
  }

  function pointsToPath(pts){
    var d = "", drawing = false;
    for (var i = 0; i < pts.length; i++) {
      var pt = pts[i];
      if (!pt) { drawing = false; continue; }
      if (!drawing) { d += "M " + pt[0].toFixed(1) + " " + (-pt[1]).toFixed(1) + " "; drawing = true; }
      else { d += "L " + pt[0].toFixed(1) + " " + (-pt[1]).toFixed(1) + " "; }
    }
    return d;
  }

  function boundingBox(pts){
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (var i = 0; i < pts.length; i++) {
      var pt = pts[i]; if (!pt) continue;
      if (pt[0] < minX) minX = pt[0]; if (pt[0] > maxX) maxX = pt[0];
      if (pt[1] < minY) minY = pt[1]; if (pt[1] > maxY) maxY = pt[1];
    }
    minX = Math.min(minX, -R_EARTH); maxX = Math.max(maxX, R_L * 1.05);
    minY = Math.min(minY, -R_EARTH); maxY = Math.max(maxY, R_EARTH);
    return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  }

  function fmtTime(sec){
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);

    lastTs = ts;

    if (current) {
      var h = Math.sqrt(GM * current.p);
      var K = 900;
      var r1 = radiusAt(current, theta);
      var dtheta = K * h / (r1 * r1) * dt;

      if (current.type === "balistica") {
        if (theta < current.thetaHit) {
          theta += dtheta;
          if (theta > current.thetaHit) theta = current.thetaHit;
        }
        // else: landed — stays put, no bounce back to the cannon.
      } else if (current.type === "circolare" || current.type === "ellittica") {
        theta += dtheta;
        if (theta > Math.PI) theta -= 2 * Math.PI;
      } else {
        var limit = current.type === "parabolica" ? Math.PI * 0.97 : Math.acos(-1 / current.e) * 0.97;
        theta += thetaDir * dtheta;
        if (theta > limit) { theta = limit; thetaDir = -1; }
        if (theta < -limit) { theta = -limit; thetaDir = 1; }
      }

      var rr = radiusAt(current, theta);
      markDot.setAttribute("cx", (rr * Math.cos(theta)).toFixed(1));
      markDot.setAttribute("cy", (-rr * Math.sin(theta)).toFixed(1));
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  slider.min = 0; slider.max = STEPS;
  var defaultV = V_CIRC_L;
  slider.value = vToSlider(defaultV);

  refCirc.textContent = "orbita " + fmt(V_CIRC_L, 1) + " km/s";
  refEsc.textContent = "fuga " + fmt(V_ESC_L, 1) + " km/s";

  slider.addEventListener("input", function(){ render(sliderToV(parseFloat(slider.value))); });

  var presets = {
    short: V_CIRC_L * 0.4,
    circ: V_CIRC_L,
    ell: V_CIRC_L * 1.25,
    para: V_ESC_L,
    hyp: V_CIRC_L * 1.55
  };
  Array.prototype.forEach.call(document.querySelectorAll(".preset-btn"), function(btn){
    btn.addEventListener("click", function(){
      var v = presets[btn.getAttribute("data-preset")];
      slider.value = vToSlider(v);
      render(v);
    });
  });

  render(defaultV);
})();
</script>

</body></html>
