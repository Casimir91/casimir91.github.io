<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 563" role="img" aria-label="Pelucchi, stormi e agenti AI">
<title>Pelucchi, stormi e agenti AI in tre mosse: pelucchi che si aggrovigliano, stormo che si allinea, agenti AI che si passano un segnale</title>
<style>
text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.cap { opacity: 0; }
.cap .a { font-size: 42px; font-weight: 700; fill: #1e2430; text-anchor: middle; }
.cap .b { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 33px; fill: #59637c; text-anchor: middle; }
.dk { opacity: 0; }
.act1, .act3 { opacity: 0; }
.bd { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)); }
.bd.big { fill: #1e2430; }
.lk line { stroke: #2a5aa8; stroke-width: 3; opacity: .75; stroke-linecap: round; }
.ed { stroke: #dde1e6; stroke-width: 3.5; stroke-linecap: round; }
.nd { fill: #fff; stroke: #59637c; stroke-width: 3.5; transform-box: fill-box; transform-origin: 50% 50%; }
.fib { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) scale(1.9); }
@keyframes cap1 { 0% { opacity: 0 } 1.8% { opacity: 1 } 31.5% { opacity: 1 } 33.3% { opacity: 0 } 100% { opacity: 0 } }
@keyframes dot1 { 0% { opacity: 0 } 1.8% { opacity: 1 } 31.5% { opacity: 1 } 33.3% { opacity: 0 } 100% { opacity: 0 } }
@keyframes cap2 { 0% { opacity: 0 } 33.3% { opacity: 0 } 35.1% { opacity: 1 } 64.8% { opacity: 1 } 66.6% { opacity: 0 } 100% { opacity: 0 } }
@keyframes dot2 { 0% { opacity: 0 } 33.3% { opacity: 0 } 35.1% { opacity: 1 } 64.8% { opacity: 1 } 66.6% { opacity: 0 } 100% { opacity: 0 } }
