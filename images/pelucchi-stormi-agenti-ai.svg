@keyframes act1 { 0% { opacity: 0 } 1.5% { opacity: 1 } 30% { opacity: 1 } 33% { opacity: 0 } 100% { opacity: 0 } }
@keyframes act2 { 0% { opacity: 0 } 33.3% { opacity: 0 } 35% { opacity: 1 } 65% { opacity: 1 } 67.5% { opacity: 0 } 100% { opacity: 0 } }
@keyframes act3 { 0% { opacity: 0 } 66.5% { opacity: 0 } 68.5% { opacity: 1 } 96% { opacity: 1 } 99% { opacity: 0 } 100% { opacity: 0 } }
@keyframes fib-fa { 0% { transform: translate(var(--x0), var(--y0)) rotate(var(--a0)) scale(2.1) } 2.5% { transform: translate(var(--x0), var(--y0)) rotate(var(--a0)) scale(2.1) } 17% { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) scale(1.9) } 100% { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) scale(1.9) } }
@keyframes fib-fb { 0% { transform: translate(var(--x0), var(--y0)) rotate(var(--a0)) scale(2.1) } 2.5% { transform: translate(var(--x0), var(--y0)) rotate(var(--a0)) scale(2.1) } 21% { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) scale(1.9) } 100% { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) scale(1.9) } }
@keyframes bird { 0% { transform: translate(var(--x0), var(--y0)) rotate(var(--a0)) } 36% { transform: translate(var(--x0), var(--y0)) rotate(var(--a0)) } 52% { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) } 100% { transform: translate(var(--x1), var(--y1)) rotate(var(--a1)) } }
@keyframes links { 0% { opacity: 0 } 53% { opacity: 0 } 57% { opacity: 1 } 100% { opacity: 1 } }
@keyframes node { 0% { fill: #fff; stroke: #59637c; transform: scale(1) } 70% { fill: #fff; stroke: #59637c; transform: scale(1) } 71.2% { fill: #2a5aa8; stroke: #2a5aa8; transform: scale(2.1) } 74% { fill: #2a5aa8; stroke: #2a5aa8; transform: scale(1) } 100% { fill: #2a5aa8; stroke: #2a5aa8; transform: scale(1) } }
@keyframes edge { 0% { stroke: #dde1e6 } 69.5% { stroke: #dde1e6 } 70.5% { stroke: #2a5aa8 } 100% { stroke: #2a5aa8 } }
@media (prefers-reduced-motion: no-preference) {
  .cap1 { animation: cap1 13.5s linear infinite; } .cap2 { animation: cap2 13.5s linear infinite; } .cap3 { animation: cap3 13.5s linear infinite; }
  .dk1 { animation: dot1 13.5s linear infinite; } .dk2 { animation: dot2 13.5s linear infinite; } .dk3 { animation: dot3 13.5s linear infinite; }
  .act1 { animation: act1 13.5s linear infinite; } .act2 { animation: act2 13.5s linear infinite; } .act3 { animation: act3 13.5s linear infinite; }
  .fa { animation: fib-fa 13.5s ease-in-out infinite; } .fb { animation: fib-fb 13.5s ease-in-out infinite; }
  .bd { animation: bird 13.5s ease-in-out infinite; }
  .lk, .rg { animation: links 13.5s linear infinite; }
  .nd { animation: node 13.5s ease-out infinite backwards; }
  .ed { animation: edge 13.5s linear infinite backwards; }
}
</style>
