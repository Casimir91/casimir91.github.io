project:
  type: website
  post-render:
    - scripts/strip-app-from-sitemap.py
  resources:
    - CNAME
    - manifest.webmanifest
    - img/*
    - toolbox/*.html
    - toolbox/*.css
    - toolbox/*.js
    - mosaicus/app/**
    - mosaicus/mosaicus_firmware.ino
    - mosaicus/media/*
    - fonts/*

website:
  title: "Prof. Rosi"
  site-url: "https://ermesfrosi.it"
  favicon: img/favicon-round.png
  image: /img/icon-512.png
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: didattica/index.qmd
        text: Didattica
      - href: edtech/index.qmd
        text: EdTech
      - href: toolbox/index.qmd
        text: Toolbox
      - href: stories/index.qmd
        text: Stories
    right:
      - href: chi-sono.qmd
        text: Chi sono
      - { icon: linkedin, href: "https://www.linkedin.com/in/ermes-f-rosi/" }

format:
  html:
    lang: it
    theme:
      light: [sandstone, fonts.scss]
      dark: [darkly, custom-dark.scss, fonts.scss]
    respect-user-color-scheme: true
    toc: true
    include-in-header: _includes/pwa-head.html
    include-after-body: brand-link.html
