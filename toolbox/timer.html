<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer · Toolbox</title>
<link rel="stylesheet" href="toolbox.css">
<style>
  .digits { font-size: calc(var(--zoom, 1) * min(27vw, 45vh)); }
  .digits.long { font-size: calc(var(--zoom, 1) * min(19vw, 45vh)); }
  .setup { display: flex; gap: .5rem; align-items: center; justify-content: center; flex-wrap: wrap; padding: .5rem 1rem; }
  .setup input {
    width: 5.5rem; padding: .5rem; font-size: 1.25rem; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: .5rem;
  }
  .setup label { color: var(--muted); }
  body.done { animation: flash .8s steps(1) infinite; }
  @keyframes flash { 50% { background: var(--danger); color: #fff; } }
  body.done .digits { color: inherit; }
  @media (prefers-reduced-motion: reduce) { body.done { animation: none; background: var(--danger); color: #fff; } }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← Toolbox</a>
    <span class="status" id="status" style="padding:0;min-height:0">Set a time and press Start</span>
  </div>

  <main class="main">
    <div class="digits" id="display" aria-live="off">05:00</div>
  </main>

  <div class="setup" id="setup">
    <label>min <input id="min" type="number" inputmode="numeric" min="0" max="999" value="5"></label>
    <label>s <input id="sec" type="number" inputmode="numeric" min="0" max="59" value="0"></label>
  </div>
  <div class="controls">
    <button data-add="-60">−1 min</button>
    <button data-preset="60">1</button>
    <button data-preset="300">5</button>
    <button data-preset="600">10</button>
    <button data-preset="900">15</button>
    <button data-preset="1800">30</button>
    <button data-preset="3600">60</button>
    <button data-add="60">+1 min</button>
  </div>
  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button id="reset">Reset</button>
    <button id="zoomOut" aria-label="Smaller digits">A−</button>
    <button id="zoomIn" aria-label="Larger digits">A+</button>
    <button id="theme">Light / Dark</button>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  let total = 300_000;     // ms set by the user
  let remaining = total;   // ms
  let endAt = 0;           // epoch ms
  let running = false, iv = null, alarmIv = null, audio = null;

  /* ---------- display ---------- */
  function render(ms) {
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const txt = h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
    $("display").textContent = txt;
    $("display").classList.toggle("long", h > 0);
    document.title = (running ? txt + " · " : "") + "Timer · Toolbox";
  }
  const readInputs = () => {
    const m = Math.max(0, parseInt($("min").value) || 0);
    const s = Math.min(59, Math.max(0, parseInt($("sec").value) || 0));
    return (m * 60 + s) * 1000;
  };
  function setTotal(sec) {
    sec = Math.max(0, Math.min(sec, 999 * 60 + 59));
    total = remaining = sec * 1000;
    $("min").value = Math.floor(sec / 60);
    $("sec").value = sec % 60;
    render(remaining);
  }

  /* ---------- alarm ---------- */
  function beep() {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.4);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.45);
    if (navigator.vibrate) navigator.vibrate(300);
  }
  function alarmOn() {
    document.body.classList.add("done");
    $("status").textContent = "Time is up!";
    beep(); let n = 0;
    alarmIv = setInterval(() => { beep(); if (++n >= 15) clearInterval(alarmIv); }, 1000);
  }
  function alarmOff() {
    document.body.classList.remove("done");
    clearInterval(alarmIv);
  }

  /* ---------- run control ---------- */
  function loop() {
    remaining = endAt - Date.now();
    if (remaining <= 0) { remaining = 0; render(0); stop(); alarmOn(); return; }
    render(remaining);
  }
  function stop() {
    running = false; clearInterval(iv);
    $("start").textContent = "Start"; $("setup").style.opacity = 1;
  }
  $("start").onclick = () => {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === "suspended") audio.resume(); // needs a user gesture
    alarmOff();
    if (running) { stop(); $("status").textContent = "Paused"; return; }
    if (remaining <= 0 || remaining === total) { total = remaining = readInputs(); }
    if (remaining <= 0) return;
    running = true; endAt = Date.now() + remaining;
    $("start").textContent = "Pause"; $("setup").style.opacity = .4;
    $("status").textContent = "Running";
    iv = setInterval(loop, 100); loop();
  };
  $("reset").onclick = () => {
    stop(); alarmOff();
    total = remaining = readInputs(); render(remaining);
    $("status").textContent = "Set a time and press Start";
  };
  document.querySelectorAll("[data-preset]").forEach(b =>
    b.onclick = () => { if (!running) { alarmOff(); setTotal(+b.dataset.preset); } });
  document.querySelectorAll("[data-add]").forEach(b =>
    b.onclick = () => {
      const d = +b.dataset.add * 1000;
      if (running) { endAt += d; loop(); }
      else { alarmOff(); setTotal(Math.round((readInputs() + d) / 1000)); }
    });
  ["min", "sec"].forEach(id => $(id).addEventListener("input", () => {
    if (!running) { total = remaining = readInputs(); render(remaining); }
  }));

  /* ---------- zoom, theme, wake lock ---------- */
  let zoom = 1;
  const setZoom = z => { zoom = Math.min(1.3, Math.max(0.4, z)); document.documentElement.style.setProperty("--zoom", zoom); };
  $("zoomIn").onclick = () => setZoom(zoom + 0.1);
  $("zoomOut").onclick = () => setZoom(zoom - 0.1);

  const root = document.documentElement;
  try { const t = localStorage.getItem("toolbox-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("toolbox-theme", next); } catch (e) {}
  };

  async function wake() { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} }
  wake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });

  render(remaining);
})();
</script>
</body>
</html>
