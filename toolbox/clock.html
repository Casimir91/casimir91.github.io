<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock · Toolbox</title>
<link rel="stylesheet" href="toolbox.css">
<script src="toolbox.js"></script>
<style>
  /* Landscape: one line HH:MM:SS. Portrait: three stacked rows, so digits stay huge on phones. */
  .digits { font-size: calc(var(--zoom, 1) * min(19vw, 52vh)); }
  .digits .sep, .digits .part { display: inline; }
  @media (orientation: portrait) {
    .digits { font-size: calc(var(--zoom, 1) * min(46vw, 22vh)); }
    .digits .part { display: block; }
    .digits .sep { display: none; }
  }
</style>
</head>
<body data-zoom-max="1.3">
  <div class="topbar">
    <a href="index.html">← Toolbox</a>
    <span class="status" id="status">Device clock</span>
    <div class="themebar" id="themebar"></div>
  </div>

  <main class="main">
    <div class="digits" id="clock" aria-live="off">
      <span class="part" id="h">--</span><span class="sep">:</span><span class="part" id="m">--</span><span class="sep">:</span><span class="part" id="s">--</span>
    </div>
  </main>

  <div class="controls">
    <button id="zoomOut" aria-label="Smaller digits">A−</button>
    <button id="zoomIn" aria-label="Larger digits">A+</button>
    <button id="sync">Sync with server</button>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  let offset = 0; // ms to add to device time

  function tick() {
    const now = Date.now() + offset;
    const d = new Date(now);
    $("h").textContent = pad(d.getHours());
    $("m").textContent = pad(d.getMinutes());
    $("s").textContent = pad(d.getSeconds());
    setTimeout(tick, 1000 - (now % 1000) + 5); // wake just after the next second
  }
  tick();

  /* Sync: the Date header of an HTTP response has 1 s resolution. We poll this site until
     the header's second changes: that instant is a precise second boundary on the server
     clock (error ≈ polling interval, a few tens of ms). */
  async function sample() {
    const t0 = performance.now(), w0 = Date.now();
    const r = await fetch(location.pathname + "?_=" + Math.random(), { method: "HEAD", cache: "no-store" });
    const t1 = performance.now();
    const date = r.headers.get("Date");
    if (!date) throw new Error("no Date header");
    return { server: Date.parse(date), local: w0 + (t1 - t0) / 2 };
  }
  async function syncNow() {
    const btn = $("sync"), st = $("status");
    btn.disabled = true; st.textContent = "Syncing…";
    try {
      let prev = await sample();
      const start = performance.now();
      while (performance.now() - start < 3500) {
        await new Promise(r => setTimeout(r, 80));
        const cur = await sample();
        if (cur.server !== prev.server) {
          const newOffset = cur.server - (prev.local + cur.local) / 2;
          if (Math.abs(newOffset) > 3600e3) throw new Error("implausible offset");
          offset = newOffset;
          st.textContent = `Synced · device clock was ${offset > 0 ? "behind" : "ahead"} by ${Math.abs(offset / 1000).toFixed(2)} s`;
          return;
        }
        prev = cur;
      }
      throw new Error("Date header did not change");
    } catch (e) {
      st.textContent = "Sync failed (works only online) · using device clock";
    } finally {
      btn.disabled = false;
    }
  }
  $("sync").onclick = syncNow;
})();
</script>
</body>
</html>
