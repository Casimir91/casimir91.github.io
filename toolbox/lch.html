<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il vettore LCH</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f1f1d;--mut:#6b6a66;--line:#d9d7d0;--acc:#0f6e56;--card:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#f0efe9;--mut:#a3a29b;--line:#3a3a37;--acc:#5dcaa5;--card:#242422;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#f0efe9;--mut:#a3a29b;--line:#3a3a37;--acc:#5dcaa5;--card:#242422;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:16px 0 8px}
h1{font-size:22px;font-weight:500;margin:0}
h2{font-size:13px;font-weight:500;color:var(--mut);margin:22px 0 8px;letter-spacing:.02em}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:transparent;border:.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
.seg button.on{border-color:var(--fg);font-weight:500}
.cmp{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:.5px solid var(--line);padding:8px 0}
.cmpg{display:grid;grid-template-columns:1fr 1fr 26px;gap:10px;align-items:start}
.cell .sw{height:44px;border-radius:8px;border:.5px solid var(--line)}
.cell .sw.empty{border-style:dashed;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.cell .t{font-size:12px;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.cell .t b{font-weight:500}
.cell .n{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.de{font-size:12px;color:var(--mut);margin-top:6px;min-height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number]{font:inherit;background:var(--card);color:var(--fg);border:.5px solid var(--line);border-radius:8px;padding:8px 10px;width:110px}
input[type=range]{width:100%}
#cv{width:100%;border-radius:10px;border:.5px solid var(--line);margin-top:10px;display:none;touch-action:manipulation}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.hues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hues button{padding:0;border:.5px solid var(--line);overflow:hidden;text-align:center;font-size:11px}
.hues .s{height:34px}
.hues button.on{outline:2px solid var(--fg)}
.pg{display:grid;gap:2px;align-items:stretch}
.pg .lab{font-size:11px;color:var(--mut);text-align:center;padding-bottom:3px}
.pg .rl{font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.tile{padding:0;border:0;border-radius:0;aspect-ratio:1/1;width:100%;position:relative;cursor:pointer}
.tile:active{transform:none}
.tile.sel{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #000}
.tile.near::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff;border:1.5px solid #000}
.intro{border:.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:13px}
.intro summary{cursor:pointer;font-size:14px}
.kv{display:grid;grid-template-columns:82px 1fr;gap:6px 10px;margin-top:10px;line-height:1.45}
.kv b{font-weight:500;font-family:ui-monospace,Menlo,Consolas,monospace}
.kv .sub{padding-left:10px;border-left:.5px solid var(--line);color:var(--mut)}
.foot{font-size:12px;color:var(--mut);margin-top:22px}
.foot summary{cursor:pointer;font-size:13px}
.foot p{margin:8px 0 0}
.ib{width:26px;height:26px;padding:0;border-radius:50%;font:italic 13px Georgia,serif;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib.on{border-color:var(--fg);color:var(--fg)}
.ib.dot::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--acc)}

input[type=number]{font:inherit;background:var(--card);color:var(--fg);border:.5px solid var(--line);border-radius:8px;padding:6px 8px}
.stage{margin:6px 0 4px}
#cv{display:block;width:100%;border:.5px solid var(--line);border-radius:12px;touch-action:none;background:transparent;margin:0;cursor:grab}
.ctl{display:grid;grid-template-columns:112px minmax(0,1fr) 50px;align-items:center;gap:12px 8px;margin-top:14px}
.ctl label{display:block;line-height:1.3}
.ctl .n{font-size:15px;font-weight:500}
.ctl small{display:block;font-size:11px;color:var(--mut)}
.ctl span{font-size:13px;text-align:right}
.res{display:flex;gap:12px;align-items:center;margin-top:16px}
.res .big{width:72px;height:72px;border-radius:12px;border:.5px solid var(--line);flex:none}
.res .tx{flex:1;min-width:0}
.res .hx{font-size:20px;font-weight:500}
.res .nm{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:.5px solid var(--line);margin-bottom:8px}
.top .sw{width:48px;height:48px;border-radius:10px;border:.5px solid var(--line);flex:none}
.top .tx{flex:1;min-width:0}
.top .hx{font-size:20px;font-weight:500;line-height:1.2}
.top .nm{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{border:.5px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px}
.ch{display:flex;gap:12px;align-items:center}
.ch .big{width:56px;height:56px;border-radius:10px;border:.5px solid var(--line);flex:none}
a{color:var(--acc)}
.kv{grid-template-columns:82px 1fr}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Il vettore LCH</h1>
<div class="row" style="gap:6px"><button id="th" aria-label="Cambia tema, chiaro o scuro">Scuro</button></div>
</header>
<p style="margin:0 0 10px;font-size:14px"><a href="colors.html">← Enciclopedia dei colori</a></p>

<div class="top">
<div id="sw" class="sw"></div>
<div class="tx"><div id="hx" class="hx mono"></div><div id="nm" class="nm"></div></div>
<button id="ib" class="ib" aria-label="Dettagli" aria-expanded="false">i</button>
</div>
<div id="info" class="panel" hidden>
<div>Tocca il cilindro per spostare il vettore. Trascina fuori dai dischi per ruotarlo in ogni direzione.</div>
<div style="margin-top:8px">Scrivi un hex: <input type="text" id="hin" placeholder="#3fa34d" maxlength="7" aria-label="Scrivi un codice hex" class="mono" style="width:100px"></div>
<div style="margin-top:8px">CSS: <span id="css" class="mono"></span> <button id="cp" style="padding:3px 8px;font-size:12px">Copia</button></div>
<div id="og" style="margin-top:6px;color:var(--mut)"></div>
<div style="margin-top:6px">Cartesiane: <span id="ab" class="mono"></span></div>
</div>

<div class="stage"><canvas id="cv" aria-label="Cilindro OKLCH: il vettore L, C, H"></canvas></div>
<div class="row" style="margin-top:8px">
<button id="bAn">Anima</button>
<button id="bVw">Dall'alto</button>
</div>

<div class="ctl">
<label for="sL"><span class="n" style="color:#378ADD">Lightness</span><small>luminosità: 0 nero, 1 bianco</small></label><input type="range" id="sL" min="0" max="1" step="0.005"><span id="vL" class="mono"></span>
<label for="sC"><span class="n" style="color:#D85A30">Chroma</span><small>intensità: 0 grigio, più alto vivido</small></label><input type="range" id="sC" min="0" max="0.37" step="0.002"><span id="vC" class="mono"></span>
<label for="sH"><span class="n" style="color:var(--fg)">Hue</span><small>tinta: angolo sulla ruota, 0–360°</small></label><input type="range" id="sH" min="0" max="360" step="1"><span id="vH" class="mono"></span>
</div>

</div>

 ell(0,cLine,1);ell(hh,cLine,1);
 if(Math.sqrt(wv[0]*wv[0]+wv[1]*wv[1])>0.03){
  var ph=Math.atan2(wv[0],-wv[1]);
  [ph,ph+Math.PI].forEach(function(a){line(P(R*Math.cos(a),R*Math.sin(a),0),P(R*Math.cos(a),R*Math.sin(a),hh),cLine,1);});
 }
 buildCur(S.L);
 var items=[{L:S.L,img:CUR.img,cur:true}];
 STACK.forEach(function(o){if(Math.abs(o.L-S.L)>=0.04)items.push({L:o.L,img:o.img,cur:false});});
 items.forEach(function(it){it.dep=wv[2]*(it.L*hh-hh/2);});
 items.sort(function(a,b){return a.dep-b.dep;});
 items.forEach(function(it){
  var half=it.img.width/2,k=R/half,zc=it.L*hh-hh/2;
  var a=r[0]*k,c=-r[1]*k,e=cx-r[0]*k*half+r[1]*k*half+r[2]*zc;
  var b=-u[0]*k,d=u[1]*k,fy=cy+u[0]*k*half-u[1]*k*half-u[2]*zc;
  ctx.save();
  ctx.setTransform(dpr*a,dpr*b,dpr*c,dpr*d,dpr*e,dpr*fy);
  ctx.globalAlpha=it.cur?0.97:0.5;ctx.imageSmoothingEnabled=true;ctx.drawImage(it.img,0,0);
  ctx.restore();
 });
 line(P(0,0,0),P(0,0,hh),cMut,1.2);
 var Cp=S.C*kc,Hr=S.H*Math.PI/180,X=Cp*Math.cos(Hr),Y=Cp*Math.sin(Hr);
 var A0=P(0,0,0),A1=P(0,0,Z),Pp=P(X,Y,Z);
 ell(Z,cMut,1);
 for(var q=0;q<36;q++){var tq=q*10*Math.PI/180,lg=(q%3===0),r2=R*(lg?1.08:1.04);
  line(P(R*Math.cos(tq),R*Math.sin(tq),Z),P(r2*Math.cos(tq),r2*Math.sin(tq),Z),cMut,1);}
 line(A0,Pp,cMut,1,[4,4]);
 line(A1,P(R*1.1,0,Z),cMut,1,[2,3]);
 line(A1,P(R*1.1*Math.cos(Hr),R*1.1*Math.sin(Hr),Z),cMut,1,[2,3]);
 line(A0,A1,cL,2.2);arrow(A0,A1,cL,8);
 if(Cp>3){line(A1,Pp,cC,2.2);arrow(A1,Pp,cC,8);}
 if(S.H>0.5){
  var nn=Math.max(8,Math.round(S.H/3));
  ctx.beginPath();
  for(var i=0;i<=nn;i++){var t=Hr*i/nn,p=P(R*Math.cos(t),R*Math.sin(t),Z);if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);}
  ctx.strokeStyle=cFg;ctx.lineWidth=1.5;ctx.stroke();
  if(Hr>0.3){
   var dd=0.07;
   arrow(P(R*Math.cos(dd),R*Math.sin(dd),Z),P(R,0,Z),cFg,7);
   arrow(P(R*Math.cos(Hr-dd),R*Math.sin(Hr-dd),Z),P(R*Math.cos(Hr),R*Math.sin(Hr),Z),cFg,7);
  }
 }
 ctx.beginPath();ctx.arc(Pp[0],Pp[1],9,0,7);ctx.fillStyle="#"+S.hex;ctx.fill();
 ctx.lineWidth=3;ctx.strokeStyle="#ffffff";ctx.stroke();
 ctx.beginPath();ctx.arc(Pp[0],Pp[1],10.5,0,7);ctx.lineWidth=1.2;ctx.strokeStyle="#000000";ctx.stroke();
}
function nameOf(lab){var best=null,bd=1e9;CSSN.forEach(function(c){var d=dist(c.lab,lab);if(d<bd){bd=d;best=c;}});return {n:best.n,d:bd,ok:bd<=2.5};}
function sync(){
 S.C=Math.min(S.C,CMAX);var cm=cmax(S.L,S.H);S.out=S.C>cm+0.002;S.Ce=Math.min(S.C,cm);
 S.hex=toHex(lch2lin(S.L,S.Ce,S.H));
 $("sL").value=S.L;$("sC").value=S.C;$("sH").value=S.H;
 $("vL").textContent=S.L.toFixed(2);$("vC").textContent=S.C.toFixed(3);$("vH").textContent=Math.round(S.H)+"°";
 $("sw").style.background="#"+S.hex;$("hx").textContent="#"+S.hex.toUpperCase();
 var lab=hex2lab(S.hex),nm=nameOf(lab);$("nm").textContent=(nm.ok?"":"≈ ")+nm.n;
 var a=S.C*Math.cos(S.H*Math.PI/180),b=S.C*Math.sin(S.H*Math.PI/180);
 $("css").textContent="oklch("+Math.round(S.L*100)+"% "+S.Ce.toFixed(3)+" "+Math.round(S.H)+")";
 $("og").textContent=S.out?"Fuori dal gamut sRGB: mostro il colore con croma ridotta da "+S.C.toFixed(3)+" a "+S.Ce.toFixed(3)+".":"";
 $("ab").textContent="a = "+a.toFixed(3)+" · b = "+b.toFixed(3);
 if(!S.vanim)$("bVw").textContent=S.M[2][2]>0.97?"Di lato":"Dall'alto";
}
function stopAnim(){if(S.anim){S.anim=null;$("bAn").textContent="Anima";}}
function paintLabels(){["L","C","H"].forEach(function(n){var el=document.querySelector('label[for="s'+n+'"] .n');if(el){var on=!!(S.anim&&S.anim.name===n);el.style.fontWeight=on?"500":"400";el.style.textDecoration=on?"underline":"none";}});}
function render(){sync();draw();paintLabels();}
var raf=0;
function loop(t){
 raf=0;var more=false;
 if(S.anim){
  var el=(t-S.anim.t0)/1000,ph=Math.floor(el/2.5)%3,fr=(el%2.5)/2.5,sm=0.5-0.5*Math.cos(2*Math.PI*fr);
  if(ph===0){S.anim.name="H";S.L=0.65;S.C=0.10;S.H=360*fr;}
  else if(ph===1){S.anim.name="C";S.L=0.65;S.H=142;S.C=cmax(0.65,142)*sm;}
  else{S.anim.name="L";S.H=142;S.L=0.2+0.7*sm;S.C=0.10;}
  more=true;
 }
 if(S.vanim){
  var tt=Math.min(1,(t-S.vanim.t0)/700),es=0.5-0.5*Math.cos(Math.PI*tt);
  S.M=ortho(q2m(slerp(S.vanim.q0,S.vanim.q1,es)));
  if(tt>=1){S.M=S.vanim.m1;S.vanim=null;}else more=true;
 }
 render();
 if(more)raf=requestAnimationFrame(loop);
}
function kick(){if(!raf)raf=requestAnimationFrame(loop);}
function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function planeXY(p,Lz){
 var M=G.M,r=M[0],u=M[1],zc=Lz*G.hh-G.hh/2,det=r[0]*u[1]-r[1]*u[0];
 if(Math.abs(det)<0.12)return null;
 var rx=p[0]-G.cx-r[2]*zc,uy=G.cy-p[1]-u[2]*zc;
 return [(rx*u[1]-r[1]*uy)/det,(r[0]*uy-u[0]*rx)/det];
}
function pick(xy){S.H=norm(Math.atan2(xy[1],xy[0])*180/Math.PI);S.C=Math.min(Math.sqrt(xy[0]*xy[0]+xy[1]*xy[1])/G.kc,CMAX);render();}
cv.addEventListener("pointerdown",function(e){
 stopAnim();S.vanim=null;var p=pos(e);
 try{cv.setPointerCapture(e.pointerId);}catch(x){}
 var lv=[S.L];LV.forEach(function(l){if(Math.abs(l-S.L)>=0.04)lv.push(l);});
 var w2=G.M[2][2];
 lv.sort(function(a,b){return w2*(b-a);});
 var hit=null,hxy=null;
 for(var i=0;i<lv.length;i++){var xy=planeXY(p,lv[i]);if(xy&&Math.sqrt(xy[0]*xy[0]+xy[1]*xy[1])<=G.R*1.02){hit=lv[i];hxy=xy;break;}}
 if(hit!==null){S.drag="pick";S.L=hit;pick(hxy);}
 else{S.drag="orbit";S.lx=p[0];S.ly=p[1];}
});
cv.addEventListener("pointermove",function(e){
 if(!S.drag)return;var p=pos(e);
 if(S.drag==="pick"){var xy=planeXY(p,S.L);if(xy)pick(xy);}
 else{
  var ay=(p[0]-S.lx)*0.009,ax=(p[1]-S.ly)*0.009,cy2=Math.cos(ay),sy2=Math.sin(ay),cx2=Math.cos(ax),sx2=Math.sin(ax);
  var Ry=[[cy2,0,sy2],[0,1,0],[-sy2,0,cy2]],Rx=[[1,0,0],[0,cx2,-sx2],[0,sx2,cx2]];
  S.M=ortho(mmul(mmul(Ry,Rx),S.M));S.lx=p[0];S.ly=p[1];render();
 }
});
function endDrag(){S.drag=null;}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
$("sL").addEventListener("input",function(){stopAnim();S.L=+this.value;render();});
$("sC").addEventListener("input",function(){stopAnim();S.C=+this.value;render();});
$("sH").addEventListener("input",function(){stopAnim();S.H=+this.value;render();});
$("hin").addEventListener("input",function(){
 var v=this.value.trim().replace("#","");
 if(/^[0-9a-fA-F]{6}$/.test(v)){stopAnim();var lab=hex2lab(v.toLowerCase());S.L=lab[0];S.C=Math.sqrt(lab[1]*lab[1]+lab[2]*lab[2]);S.H=norm(Math.atan2(lab[2],lab[1])*180/Math.PI);render();}
});
$("bAn").onclick=function(){if(S.anim){stopAnim();render();}else{S.anim={t0:performance.now(),name:"H"};this.textContent="Ferma";kick();}};
$("bVw").onclick=function(){
 var toTop=S.M[2][2]<=0.97,m1=toTop?VIEW_TOP:VIEW_SIDE;
 S.vanim={q0:m2q(S.M),q1:m2q(m1),m1:m1,t0:performance.now()};
 $("bVw").textContent=toTop?"Di lato":"Dall'alto";kick();
};
$("ib").onclick=function(){var d=$("info");d.hidden=!d.hidden;this.classList.toggle("on",!d.hidden);this.setAttribute("aria-expanded",String(!d.hidden));};
$("cp").onclick=function(){try{navigator.clipboard.writeText($("css").textContent);}catch(e){}var b=this;b.textContent="Copiato";setTimeout(function(){b.textContent="Copia";},900);};
function effDark(){var t=document.documentElement.getAttribute("data-theme");if(t)return t==="dark";return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);}
function paintTheme(){$("th").textContent=effDark()?"Chiaro":"Scuro";}
try{var sv=localStorage.getItem("th");if(sv)document.documentElement.setAttribute("data-theme",sv);}catch(e){}
$("th").onclick=function(){var d=!effDark();document.documentElement.setAttribute("data-theme",d?"dark":"light");try{localStorage.setItem("th",d?"dark":"light");}catch(e){}paintTheme();draw();};
paintTheme();
window.addEventListener("resize",draw);
render();
</script>
